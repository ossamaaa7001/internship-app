<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Internship Radar • Student Workspace</title><style>
:root{font-family:Inter,system-ui,Arial;background:#f5f7fb;color:#15233a}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;background:#245bff;color:white;font-weight:650}button:hover{filter:brightness(.94);transform:translateY(-1px)}button:focus-visible,input:focus-visible{outline:3px solid #88a9ff}.ghost{background:#edf2ff;color:#2450b5}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}aside{background:#101c37;color:white;padding:26px 18px;position:sticky;top:0;height:100vh}.brand{font-size:23px;font-weight:850;margin:0 10px 30px}.brand span{color:#79a1ff}nav button{display:block;width:100%;text-align:left;margin:7px 0;background:transparent;color:#bdc9e1}nav button.active,nav button:hover{background:#273d67;color:white}main{padding:30px;max-width:1500px;width:100%}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.muted{color:#64748b}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:23px 0}.panel,.stat,.job{background:white;border:1px solid #e2e8f3;border-radius:18px;padding:20px;box-shadow:0 8px 26px #19336308}.stat strong{display:block;font-size:31px;margin-top:8px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.job{margin-bottom:13px;transition:.2s}.job:hover{box-shadow:0 12px 35px #15233a16;transform:translateY(-2px)}.job h3{margin:0 0 5px}.job p{margin:8px 0}.tag{display:inline-block;border-radius:30px;background:#e9f2ff;color:#2753a6;padding:5px 10px;font-size:12px;margin:5px 5px 5px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}input,select,textarea{padding:12px;border:1px solid #cbd5e1;border-radius:11px;width:100%;background:white;color:#15233a}label{display:block;margin:12px 0 5px;font-weight:600}.row{display:flex;gap:10px}.row>*{flex:1}.hidden{display:none!important}.badge{padding:6px 10px;border-radius:20px;background:#e8f8ef;color:#126d39;font-size:12px}.banner{padding:13px 17px;background:#fff7df;border:1px solid #f0dba0;border-radius:13px;margin:16px 0}.view{animation:fade .25s ease}@keyframes fade{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.modal{position:fixed;inset:0;background:#0c1636a8;display:grid;place-items:center;padding:18px;z-index:10}.modal .panel{width:min(480px,100%)}#toast{position:fixed;bottom:22px;right:22px;background:#142a4b;color:white;padding:14px 20px;border-radius:12px;display:none;z-index:20}.float{position:fixed;right:18px;bottom:80px;display:grid;gap:7px}.float button{border-radius:50%;width:44px;height:44px;padding:0}a{color:#245bff}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:700px){.shell{display:block}aside{height:auto;position:relative;padding:14px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}.brand{margin:5px 8px 12px}main{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}.row{flex-direction:column}}
</style></head><body><div class="shell"><aside><div class="brand">◉ Internship <span>Radar</span></div><nav id="nav"></nav><p style="margin:30px 10px;color:#a8b8d8;font-size:12px">Find • Match • Apply • Grow</p></aside><main><div class="top"><div><h1 id="heading" style="margin:0">Your dashboard</h1><div class="muted" id="sub">Your internship journey, organized.</div></div><div class="actions"><button class="ghost" id="modeBtn">🌙 Theme</button><button id="accountBtn">👤 Sign in</button></div></div><div id="banner" class="banner">Preview mode: opportunities are examples, not verified live listings. Account and sync features activate when connected to the backend.</div><div id="content"></div></main></div><div class="float"><button onclick="window.scrollBy({top:600,behavior:'smooth'})" title="Scroll down">↓</button><button onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top">↑</button></div><div id="modal" class="modal hidden"><div class="panel" id="modalBody"></div></div><div id="toast"></div><script>
const sample=[{id:1,title:'Software Engineering Internship',organization:'Example Technology Studio',location:'Nairobi, Kenya',category:'Technology',compensation:'Not specified',eligibility:'Potential Match',deadline:null,canonical_url:'#'},{id:2,title:'Finance Graduate Internship',organization:'Example Finance Group',location:'Remote',category:'Finance',compensation:'Not specified',eligibility:'Potential Match',deadline:null,canonical_url:'#'},{id:3,title:'Marketing & Communications Intern',organization:'Example Creative Agency',location:'Mombasa, Kenya',category:'Marketing',compensation:'Not specified',eligibility:'Potential Match',deadline:null,canonical_url:'#'},{id:4,title:'Data Analytics Internship',organization:'Example Analytics Lab',location:'Nairobi, Kenya',category:'Technology',compensation:'Not specified',eligibility:'Potential Match',deadline:null,canonical_url:'#'},{id:5,title:'Environmental Research Intern',organization:'Example Sustainability Center',location:'Remote',category:'Research',compensation:'Not specified',eligibility:'Potential Match',deadline:null,canonical_url:'#'}];
let jobs=sample, user=null, token=sessionStorage.getItem('radar_token'), saved=JSON.parse(localStorage.getItem('radar_saved')||'[]'), apps=JSON.parse(localStorage.getItem('radar_apps')||'{}'), profile=JSON.parse(localStorage.getItem('radar_profile')||'{"field_of_study":"","preferred_categories":[],"preferred_locations":["Kenya","Remote"],"country":"Kenya","email_enabled":false}'), page='Dashboard', q='', category='All', matches={};let live=false;
const pages=['Dashboard','Find internships','Saved jobs','Applications','My profile','Notifications'];const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}function store(){localStorage.setItem('radar_saved',JSON.stringify(saved));localStorage.setItem('radar_apps',JSON.stringify(apps));localStorage.setItem('radar_profile',JSON.stringify(profile))}async function request(path,opt={}){let r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});if(!r.ok)throw Error((await r.json().catch(()=>({}))).detail||'Request failed');return r.json()}async function init(){try{const r=await request('/health');live=r.status==='ok';if(live){jobs=await request('/api/opportunities');if(token){try{user=await request('/api/me');saved=await request('/api/me/saved');apps=Object.fromEntries((await request('/api/me/applications')).map(a=>[a.opportunity_id,a]));profile={...profile,...user};matches=Object.fromEntries((await request('/api/me/recommendations')).map(x=>[x.id,x.score]));}catch(e){token=null;sessionStorage.removeItem('radar_token')}}}}catch(e){}$('banner').textContent=live?'Connected to backend. Opportunities appear only when real sources have been configured and collected; no demo jobs are mixed into live results.':'Preview mode: sample opportunities only. Login, email alerts and real internship feeds require a running backend and configuration.';render()}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function nav(){ $('nav').innerHTML=pages.map(p=>`<button class="${page===p?'active':''}" data-p="${p}">${({Dashboard:'▦','Find internships':'⌕','Saved jobs':'♡',Applications:'☑','My profile':'♙',Notifications:'♧'})[p]} ${p}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.p))}function score(j){if(matches[j.id]!=null)return matches[j.id];let s=35;let text=(j.title+' '+j.category).toLowerCase();if(profile.field_of_study&&text.includes(profile.field_of_study.toLowerCase()))s+=30;if((profile.preferred_categories||[]).some(c=>text.includes(c.toLowerCase())))s+=20;if((profile.preferred_locations||[]).some(l=>j.location.toLowerCase().includes(l.toLowerCase())))s+=15;return Math.min(99,s)}function jobCard(j){return `<article class="job"><div class="top"><h3>${safe(j.title)}</h3><span class="badge">${score(j)}% match</span></div><p class="muted">${safe(j.organization)} · ${safe(j.location)}</p><span class="tag">${safe(j.category)}</span><span class="tag">${safe(j.compensation)}</span><p class="muted" style="font-size:13px">${j.deadline?'Deadline: '+safe(j.deadline):'Deadline not provided'} · ${live?safe(j.verification_status||'Unverified'):'Demo listing'}</p><div class="actions"><button class="ghost" data-save="${j.id}">${saved.includes(j.id)?'♥ Saved':'♡ Save'}</button><button data-track="${j.id}">Track application</button>${live&&j.canonical_url&&j.canonical_url!=='#'?`<button class="ghost" data-open="${j.id}">View source ↗</button>`:''}</div></article>`}function attach(){document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>toggleSave(+b.dataset.save));document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>track(+b.dataset.track));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{let j=jobs.find(x=>x.id==b.dataset.open);if(j&&/^https?:\/\//.test(j.canonical_url))window.open(j.canonical_url,'_blank','noopener,noreferrer')})}async function toggleSave(id){let yes=saved.includes(id);try{if(live){if(!user)return auth();await request('/api/me/saved/'+id,{method:yes?'DELETE':'POST'})}saved=yes?saved.filter(x=>x!==id):[...saved,id];store();render();toast(yes?'Removed from saved':'Internship saved')}catch(e){toast(e.message)}}function track(id){if(live&&!user)return auth();let a=apps[id]||{status:'interested',notes:''};modal(`<h2>Track application</h2><p>${safe(jobs.find(x=>x.id===id)?.title)}</p><label>Status</label><select id="appStatus">${['interested','applied','interview','offer','rejected'].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`)}</select><label>Private notes</label><textarea id="appNotes" rows="4">${safe(a.notes)}</textarea><div class="actions"><button id="saveTrack">Save progress</button><button class="ghost" id="closeModal">Cancel</button></div>`);$('saveTrack').onclick=async()=>{let val={status:$('appStatus').value,notes:$('appNotes').value};try{if(live)await request('/api/me/applications/'+id,{method:'PUT',body:JSON.stringify(val)});apps[id]=val;store();close();render();toast('Application updated')}catch(e){toast(e.message)}}}
function modal(body){$('modalBody').innerHTML=body;$('modal').classList.remove('hidden');$('closeModal')?.addEventListener('click',close)}function close(){$('modal').classList.add('hidden')}$('modal').onclick=e=>{if(e.target===$('modal'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});function auth(){modal(`<h2>Student account</h2><p class="muted">${live?'Create an account or sign in to sync your saved jobs and applications.':'Account registration requires the backend. This browser preview remains usable without login.'}</p><label>Email</label><input id="email" type="email" placeholder="you@example.com"><label>Password (12+ characters for registration)</label><input id="password" type="password"><div class="actions"><button id="login">Sign in</button><button class="ghost" id="register">Register</button><button class="ghost" id="closeModal">Close</button></div>`);$('login').onclick=()=>doAuth(false);$('register').onclick=()=>doAuth(true)}async function doAuth(reg){if(!live)return toast('Start the backend to enable accounts');let email=$('email').value,password=$('password').value;try{if(reg)await request('/api/auth/register',{method:'POST',body:JSON.stringify({email,password})});let r=await request('/api/auth/login',{method:'POST',body:JSON.stringify({email,password})});token=r.token;sessionStorage.setItem('radar_token',token);user=await request('/api/me');saved=await request('/api/me/saved');apps=Object.fromEntries((await request('/api/me/applications')).map(a=>[a.opportunity_id,a]));close();render();toast('Welcome to Internship Radar')}catch(e){toast(e.message)}}
function render(){nav();$('heading').textContent=page;$('sub').textContent=user?'Signed in as '+user.email:'Your internship journey, organized.';$('accountBtn').textContent=user?'Sign out':'👤 Sign in';$('accountBtn').onclick=()=>{if(user){user=null;token=null;sessionStorage.removeItem('radar_token');saved=[];apps={};render();toast('Signed out')}else auth()};let c=$('content');if(page==='Dashboard'){c.innerHTML=`<div class="cards">${[['Opportunities',jobs.length],['Saved',saved.length],['Applications',Object.keys(apps).length],['Strong matches',jobs.filter(j=>score(j)>=70).length]].map(([a,b])=>`<div class="stat"><div class="muted">${a}</div><strong>${b}</strong></div>`).join('')}</div><div class="layout"><section><div class="top"><h2>Recommended for you</h2><button class="ghost" id="explore">Explore all →</button></div>${jobs.slice().sort((a,b)=>score(b)-score(a)).slice(0,4).map(jobCard).join('')||'<div class="panel">No live opportunities yet. Configure approved internship feeds to populate this page.</div>'}</section><section><div class="panel"><h3>🚀 Build your profile</h3><p class="muted">Tell us your study field and preferred locations to improve relevance.</p><button id="profileLink">Update profile →</button></div><div class="panel" style="margin-top:15px"><h3>Application pipeline</h3>${['interested','applied','interview','offer'].map(s=>`<p>${s}: <b>${Object.values(apps).filter(a=>a.status===s).length}</b></p>`).join('')}</div></section></div>`;$('explore').onclick=()=>go('Find internships');$('profileLink').onclick=()=>go('My profile')}else if(page==='Find internships'){let cats=['All',...new Set(jobs.map(j=>j.category).filter(Boolean))];c.innerHTML=`<div class="panel" style="margin:22px 0"><div class="row"><input id="search" placeholder="Search titles, companies, locations…" value="${safe(q)}"><select id="category">${cats.map(x=>`<option ${category===x?'selected':''}>${safe(x)}</option>`).join('')}</select></div></div><div id="results"></div>`;function update(){let f=jobs.filter(j=>(category==='All'||j.category===category)&&[j.title,j.organization,j.location].join(' ').toLowerCase().includes(q.toLowerCase()));$('results').innerHTML=`<p class="muted">${f.length} opportunities</p>${f.map(jobCard).join('')||'<div class="panel">No matching opportunities.</div>'}`;attach()}$('search').oninput=e=>{q=e.target.value;update()};$('category').onchange=e=>{category=e.target.value;update()};update()}else if(page==='Saved jobs'){c.innerHTML=`<h2>Saved opportunities</h2>${jobs.filter(j=>saved.includes(j.id)).map(jobCard).join('')||'<div class="panel">Nothing saved yet. Explore opportunities and tap Save.</div>'}`}else if(page==='Applications'){c.innerHTML=`<h2>Application tracker</h2>${jobs.filter(j=>apps[j.id]).map(j=>`<div class="job"><h3>${safe(j.title)}</h3><p class="muted">${safe(j.organization)} · ${safe(apps[j.id].status)}</p><p>${safe(apps[j.id].notes)}</p><button data-track="${j.id}">Update status</button></div>`).join('')||'<div class="panel">No applications tracked yet.</div>'}`}else if(page==='My profile'){c.innerHTML=`<div class="panel" style="max-width:680px;margin-top:20px"><h2>Student preferences</h2><label>Field of study</label><input id="field" value="${safe(profile.field_of_study)}" placeholder="e.g. Computer Science"><label>Preferred categories (comma-separated)</label><input id="cats" value="${safe((profile.preferred_categories||[]).join(', '))}"><label>Preferred locations (comma-separated)</label><input id="locs" value="${safe((profile.preferred_locations||[]).join(', '))}"><label>Country</label><input id="country" value="${safe(profile.country)}"><label><input id="emails" type="checkbox" style="width:auto" ${profile.email_enabled?'checked':''}> Enable email alerts (requires SMTP setup)</label><p><button id="saveProfile">Save preferences</button></p><p class="muted">Matching uses transparent, rule-based relevance scoring; it is not an external AI model.</p></div>`;$('saveProfile').onclick=async()=>{profile={...profile,field_of_study:$('field').value,preferred_categories:$('cats').value.split(',').map(x=>x.trim()).filter(Boolean),preferred_locations:$('locs').value.split(',').map(x=>x.trim()).filter(Boolean),country:$('country').value,email_enabled:$('emails').checked};try{if(live){if(!user)return auth();await request('/api/me/preferences',{method:'PUT',body:JSON.stringify({...{qualification:null,graduation_year:null,remote_preference:'any',max_experience_years:2,paid_preference:'any',digest_frequency:'instant'},...profile})});matches=Object.fromEntries((await request('/api/me/recommendations')).map(x=>[x.id,x.score]))}store();toast('Preferences saved')}catch(e){toast(e.message)}}}else{c.innerHTML=`<div class="panel" style="margin-top:20px"><h2>🔔 Notification center</h2><p class="muted">Email delivery requires verified addresses, configured SMTP credentials, and a running notification worker. No messages have been sent by this preview.</p><p>Configure your email preferences under My profile.</p><button id="toProfile">Open preferences</button></div>`;$('toProfile').onclick=()=>go('My profile')}attach()}
$('modeBtn').onclick=()=>{document.documentElement.style.filter=document.documentElement.style.filter?'':'invert(.87) hue-rotate(180deg)';toast('Theme changed')};init();
</script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://nnvmhxwcqgqwhggatcmp.supabase.co','sb_publishable_jm-DonFSa6-mWupkVp78nw_OJqMibaR');
const api='https://internship-radar-api-lnyk.onrender.com';
const style=document.createElement('style');style.textContent=`#radar-live{position:fixed;right:18px;bottom:18px;z-index:9999;width:min(380px,calc(100vw - 36px));max-height:85vh;overflow:auto;background:#fff;color:#172039;border:1px solid #d9dce6;box-shadow:0 12px 45px #0003;border-radius:18px;padding:18px;font:14px system-ui}#radar-live input,#radar-live select{box-sizing:border-box;width:100%;padding:10px;margin:5px 0;border:1px solid #ccd2dc;border-radius:8px}#radar-live button{background:#bc2647;color:#fff;border:0;border-radius:9px;padding:10px 12px;cursor:pointer;margin:3px}#radar-live .item{border-top:1px solid #eee;padding:10px 0}#radar-live a{color:#ad1b41}#radar-live small{color:#667}#radar-live .error{color:#b11}#radar-live summary{cursor:pointer;font-weight:700}`;document.head.append(style);
const box=document.createElement('aside');box.id='radar-live';box.innerHTML='<details open><summary>🔴 Internship Radar · Live account</summary><div id="radar-content">Loading...</div></details>';document.body.append(box);
const root=box.querySelector('#radar-content');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let session=null,items=[];
async function call(path,options={}){const h={'Content-Type':'application/json'};if(session?.access_token)h.Authorization='Bearer '+session.access_token;const r=await fetch(api+path,{...options,headers:h});if(!r.ok)throw Error('API error '+r.status);return r.json()}
async function refresh(){const res=await sb.auth.getSession();session=res.data.session;if(!session){root.innerHTML='<p>Sign up or sign in to save internships and track applications.</p><form id="radar-auth"><input name="email" type="email" placeholder="Email address" required><input name="password" type="password" placeholder="Password (6+ characters)" minlength="6" required><button name="action" value="login">Sign in</button><button name="action" value="signup">Register</button></form><p id="radar-msg"></p>';const f=root.querySelector('form');f.addEventListener('click',e=>{if(e.target.name==='action')f.dataset.action=e.target.value});f.onsubmit=async e=>{e.preventDefault();const d=new FormData(f),email=d.get('email'),password=d.get('password');const action=f.dataset.action||'login';const result=action==='signup'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});root.querySelector('#radar-msg').textContent=result.error?.message||(action==='signup'?'Check your email to confirm your account.':'Signed in');if(!result.error)await refresh()};return}
root.innerHTML='<p>Signed in as <strong>'+esc(session.user.email)+'</strong></p><button id="radar-out">Sign out</button><h3>Live internship listings</h3><div id="radar-list">Loading...</div><h3>My applications</h3><div id="radar-apps">Loading...</div>';root.querySelector('#radar-out').onclick=async()=>{await sb.auth.signOut();await refresh()};try{items=await call('/internships');root.querySelector('#radar-list').innerHTML=items.length?items.map(i=>'<div class="item"><strong>'+esc(i.title)+'</strong><br>'+esc(i.company)+' · '+esc(i.location)+'<br>'+(i.source_url?'<a target="_blank" rel="noopener noreferrer" href="'+esc(i.source_url)+'">Apply at source ↗</a> ':'')+'<button data-save="'+esc(i.id)+'">Track</button></div>').join(''):'<p>No published internships yet. Listings will appear here when added to the database.</p>';root.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{try{await call('/applications',{method:'POST',body:JSON.stringify({internship_id:b.dataset.save,status:'saved'})});await refresh()}catch(e){alert(e.message)}})}catch(e){root.querySelector('#radar-list').innerHTML='<p class="error">'+esc(e.message)+'</p>'}try{const apps=await call('/applications');root.querySelector('#radar-apps').innerHTML=apps.length?apps.map(a=>'<div class="item">'+esc(items.find(i=>i.id===a.internship_id)?.title||'Internship')+'<select data-app="'+esc(a.id)+'">'+['saved','applied','interview','offer','rejected','withdrawn'].map(s=>'<option '+(s===a.status?'selected':'')+'>'+s+'</option>').join('')+'</select></div>').join(''):'<p>No tracked applications yet.</p>';root.querySelectorAll('[data-app]').forEach(el=>el.onchange=async()=>{await call('/applications/'+encodeURIComponent(el.dataset.app),{method:'PATCH',body:JSON.stringify({status:el.value})});await refresh()})}catch(e){root.querySelector('#radar-apps').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
sb.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();
</script></body></html>
